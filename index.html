<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>픽셀편의점 - 야간 알바 주문 맞추기</title>
  <meta name="description" content="밤 10시부터 아침 6시까지, 손님 주문을 빠르게 맞추는 무료 픽셀 편의점 알바 게임.">
  <meta name="theme-color" content="#1b1626">
  <link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Galmuri11'; font-weight: 700; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #1b1626; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Galmuri11', sans-serif;
    }
    canvas { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
    noscript { color: #fff; padding: 16px; }
  </style>
</head>
<body>
  <canvas id="screen" aria-label="픽셀편의점 게임 화면"></canvas>
  <noscript>이 게임은 자바스크립트를 켜야 할 수 있어요.</noscript>
  <script src="js/sprites.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
